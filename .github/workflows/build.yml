name: Build

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

jobs:

  build-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - uses: actions/checkout@v4

      - name: Installing Yarn packages
        run: yarn --prefer-offline

      - name: Compiling FE
        run: npm run build


  build-be:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - uses: actions/checkout@v4

      - name: Building BE
        run: dotnet build api/Citr0sApp.sln


  test-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - uses: actions/checkout@v4

      - name: Installing Yarn packages
        run: yarn --prefer-offline

      # - name: Testing FE
      #   run: npm run test-ci


  test-be:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - uses: actions/checkout@v4

      - name: Testing BE
        run: dotnet test api/Citr0sApp.sln


  lint-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - uses: actions/checkout@v4

      - name: Installing Yarn packages
        run: yarn --prefer-offline

      # - name: Linting FE
      #   run: npm run lint


  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t home-app . --platform linux/amd64
